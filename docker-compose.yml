version: '3.8'

services:
  # 1. Next.js Web Client
  client:
    build:
      context: ./client
      dockerfile: ../infra/docker/client.Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - server
    restart: unless-stopped

  # 2. FastAPI Main API Server
  server:
    build:
      context: ./server
      dockerfile: ../infra/docker/server.Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/comlina
      - REDIS_URL=redis://redis:6379/0
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - META_APP_ID=${META_APP_ID:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - META_REDIRECT_URI=${META_REDIRECT_URI:-http://localhost:3000/connect/instagram}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN:-}
      - META_GRAPH_API_VERSION=${META_GRAPH_API_VERSION:-v21.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 3. ARQ Background Automation Worker
  worker:
    build:
      context: ./worker
      dockerfile: ../infra/docker/worker.Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/comlina
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-}
      - META_GRAPH_API_VERSION=${META_GRAPH_API_VERSION:-v21.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 4. PostgreSQL Database
  postgres:
    image: postgres:16.4-alpine3.20
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-comlina}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comlina"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 5. Redis Job Queue & Deduplication
  redis:
    image: redis:7.2.5-alpine3.20
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
