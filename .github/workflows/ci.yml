name: Comlina CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  client-check:
    name: Client Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm --prefix client ci

      - name: Typecheck Next.js Client
        run: npm --prefix client run typecheck

      - name: Lint Next.js Client
        run: npm --prefix client run lint

      - name: Build Next.js Bundle
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
        run: npm --prefix client run build

  server-test:
    name: FastAPI Server Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r server/requirements.txt
          pip install -r worker/requirements.txt

      - name: Run Server Tests
        env:
          ENVIRONMENT: development
          TOKEN_ENCRYPTION_KEY: -YSQRVH6AHTJ1PMLC9Y53jfzV1Ytu4EUWZ7c4qJDbco=
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_JWT_SECRET: placeholder_jwt_secret
          PYTHONPATH: .:server:worker
        run: python -m pytest server/tests/ -v

  worker-test:
    name: ARQ Worker Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r worker/requirements.txt

      - name: Run Worker Tests
        env:
          TOKEN_ENCRYPTION_KEY: -YSQRVH6AHTJ1PMLC9Y53jfzV1Ytu4EUWZ7c4qJDbco=
          PYTHONPATH: .:server:worker
        run: python -m pytest worker/tests/ -v
